plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.braillewordgeometry'
version = '0.1.0'

apply from: '../nitrogen/generated/android/BrailleWordGeometry+autolinking.gradle'
def geometryArchitectures = (rootProject.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,x86,x86_64,arm64-v8a').split(',')

android {
  if (rootProject.hasProperty('ndkVersion')) {
    ndkVersion rootProject.ext.ndkVersion
  }
  namespace "expo.modules.braillewordgeometry"
  buildFeatures { prefab true }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-frtti -fexceptions'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        abiFilters(*geometryArchitectures)
      }
    }
  }
  externalNativeBuild {
    cmake { path 'CMakeLists.txt' }
  }
  packagingOptions {
    jniLibs.excludes += ['**/libc++_shared.so', '**/libfbjni.so', '**/libjsi.so', '**/libreactnative.so']
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
  implementation project(':react-native-vision-camera')
  implementation project(':react-native-nitro-image')
  implementation 'androidx.camera:camera-core:1.7.0-alpha02'
}
